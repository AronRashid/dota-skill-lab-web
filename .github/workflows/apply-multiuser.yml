name: Apply multi-user client patch

on:
  push:
    paths:
      - '.github/workflows/apply-multiuser.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch
        run: node scripts/apply-multiuser.mjs
      - name: Validate JavaScript
        run: node --check app.js
      - name: Commit patched client
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "dota-skill-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.js
          git commit -m "Enable cross-device multi-user profile sync"
          git push
